# ==========================================
# 🏝️ AeroxisIslas - Configuración Principal (Grid Nativo)
# ==========================================

islas:
  # El nombre de la estructura nativa (.nbt) que se pegará usando NexoPaster.
  # El archivo debe estar en: plugins/AeroxisCore/templates/template_isla.nbt
  plantilla_base: "template_isla"

  # Distancia matemática entre islas en el mundo 'nexo_islas_world'
  # ⚠️ ADVERTENCIA: No cambiar si ya hay jugadores con islas creadas.
  grid_spacing: 1000

  # Valores iniciales (Nivel 1) para jugadores que recién crean su isla
  limites_iniciales:
    # Fórmula del radio: Nivel actual * este valor. (Nivel 1 * 25 = 25x25 bloques)
    radio_bloques_por_nivel: 25
    miembros_maximos: 4
    minions_maximos: 3

# ==========================================
# 💰 Costos de Mejoras (Conectado a AeroxisEconomy)
# ==========================================
mejoras:
  # Mejoras para expandir el límite de construcción (Frontera)
  frontera:
    nivel_2:
      costo_coins: 50000
    nivel_3:
      costo_coins: 150000
    nivel_4:
      costo_coins: 500000

  # Mejoras para invitar a más amigos al Co-op
  miembros:
    nivel_2:
      costo_gems: 500 # Costo en Gemas (Moneda Premium)
      nuevo_limite: 6
    nivel_3:
      costo_gems: 1200
      nuevo_limite: 8

# ==========================================
# 📈 MOTOR DE PROGRESIÓN Y NIVELES (NUEVO)
# ==========================================
level-engine:
  # Fórmula: xp_requerida = base_xp * (multiplier ^ (nivel - 1))
  base-xp: 1000.0
  multiplier: 1.15

  # Puntos otorgados por cada acción (Editable y Recargable)
  sources:
    blocks:
      # Agricultura y Minería Básica
      WHEAT: 0.5
      POTATOES: 0.5
      CARROTS: 0.5
      COBBLESTONE: 0.1
      STONE: 0.1
      # Minerales
      COAL_ORE: 1.0
      DEEPSLATE_COAL_ORE: 1.0
      COPPER_ORE: 1.0
      IRON_ORE: 2.0
      DEEPSLATE_IRON_ORE: 2.0
      GOLD_ORE: 3.0
      DEEPSLATE_GOLD_ORE: 3.0
      DIAMOND_ORE: 10.0
      DEEPSLATE_DIAMOND_ORE: 10.0
      EMERALD_ORE: 12.0
      # Madera
      OAK_LOG: 0.5
      BIRCH_LOG: 0.5
      SPRUCE_LOG: 0.5
      JUNGLE_LOG: 0.5
      ACACIA_LOG: 0.5
      DARK_OAK_LOG: 0.5

    mobs:
      # Entidades Vanilla
      COW: 1.0
      PIG: 1.0
      SHEEP: 1.0
      CHICKEN: 1.0
      RABBIT: 1.0
      ZOMBIE: 2.5
      SKELETON: 2.5
      SPIDER: 2.5
      CREEPER: 2.5
      SLIME: 2.5
      ENDERMAN: 5.0
      BLAZE: 5.0
      MAGMA_CUBE: 5.0
      IRON_GOLEM: 15.0
      RAVAGER: 15.0
      WITHER: 1000.0

      # 👑 Jefes Customs de AeroxisCore (Usar el internalBossName)
      REVENANT_BOSS: 5000.0
      ABYSSAL_KING: 15000.0
      SLIME_EMPEROR: 8000.0

    # 🎣 Compatibilidad Nativa con EvenMoreFish (Por Rareza)
    emf-rarities:
      Common: 5.0
      Rare: 15.0
      Epic: 50.0
      Legendary: 200.0
      Mythic: 1000.0